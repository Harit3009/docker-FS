version: '3.8'

services:
  # ----------------------------------------------------------------
  # 1. POSTGRESQL
  # ----------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: fs_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: file_system
    # OPTIMIZATION: Buffer writes in RAM, flush to disk every 15 mins instead of 5
    command: >
      postgres -c 'shared_buffers=1GB' 
               -c 'checkpoint_timeout=15min' 
               -c 'checkpoint_completion_target=0.9' 
               -c 'wal_writer_delay=200ms'
               -c 'max_connections=150'
    logging:
      driver: 'json-file'
      options:
        mode: 'non-blocking'
        max-buffer-size: '4m'
        max-size: '10m'
        max-file: '3'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fs_network

  # ----------------------------------------------------------------
  # 2. KAFKA (KRaft Mode)
  # ----------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fs_kafka
    ports:
      - '9092:9092'
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # OPTIMIZATION: Disk sync every 60s instead of 1s. Background fetches slowed down.
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 9223372036854775807
      KAFKA_LOG_FLUSH_INTERVAL_MS: 60000
      KAFKA_FETCH_MAX_WAIT_MS: 5000
      KAFKA_METADATA_MAX_IDLE_INTERVAL_MS: 5000
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: '-Xmx4g -Xms2g'
    logging:
      driver: 'json-file'
      options:
        mode: 'non-blocking'
        max-buffer-size: '4m'
        max-size: '10m'
        max-file: '3'
    networks:
      - fs_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fs_kafka_ui
    ports:
      - '8081:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - fs_network
    depends_on:
      - kafka

  # ----------------------------------------------------------------
  # 3. OPENSEARCH & DASHBOARDS
  # ----------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: fs_opensearch
    entrypoint: >
      bash -c "
        if [ ! -d plugins/prometheus-exporter ]; then
          ./bin/opensearch-plugin install --batch https://github.com/opensearch-project/opensearch-prometheus-exporter/releases/download/2.11.0.0/prometheus-exporter-2.11.0.0.zip;
        fi;
        exec ./opensearch-docker-entrypoint.sh opensearch
      "
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - 'OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx8g'
      - 'OPENSEARCH_INITIAL_ADMIN_PASSWORD=StrongPassword123!'
      - 'DISABLE_SECURITY_PLUGIN=true'
      # OPTIMIZATION: Batch index writes in memory
      - 'indices.memory.index_buffer_size=30%'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: 'json-file'
      options:
        mode: 'non-blocking'
        max-buffer-size: '4m'
        max-size: '10m'
        max-file: '3'
    ports:
      - '9200:9200'
      - '9600:9600'
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - fs_network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: fs_dashboards
    ports:
      - '5601:5601'
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: 'true'
    networks:
      - fs_network
    depends_on:
      - opensearch

  # ----------------------------------------------------------------
  # 4. HIGH-PERFORMANCE STORAGE ENGINE: MINIO
  # ----------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: fs_minio
    ports:
      - '9000:9000' # S3 API endpoint
      - '9001:9001' # Web Console UI endpoint
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      # 🎯 CHANGE: Removed the MINIO_NOTIFY_KAFKA settings entirely.
      # Your standalone node script handles listening and routing now.
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    logging:
      driver: 'json-file'
      options:
        mode: 'non-blocking'
        max-buffer-size: '4m'
        max-size: '10m'
        max-file: '3'
    networks:
      - fs_network
    depends_on:
      - kafka

  # ----------------------------------------------------------------
  # 5. LOCALSTACK
  # ----------------------------------------------------------------
  localstack:
    image: localstack/localstack
    container_name: fs_localstack
    ports:
      - '4566:4566'
    environment:
      - SERVICES=s3,sqs,sns,lambda,logs
      - DEBUG=0 # OPTIMIZATION: Reduced debug noise to cut down log writes
      - DOCKER_HOST=unix:///var/run/docker.sock
      - PERSISTENCE=1
      - LAMBDA_DOCKER_NETWORK=fs_network
      - GATEWAY_LISTEN=0.0.0.0:4566
      - EXTRA_CORS_ALLOWED_ORIGINS=*
    logging:
      driver: 'json-file'
      options:
        mode: 'non-blocking'
        max-buffer-size: '4m'
        max-size: '10m'
        max-file: '3'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      - './localstack-init.sh:/etc/localstack/init/ready.d/init.sh'
      - '/Volumes/ssd/fs_project_data/localstack:/var/lib/localstack'
      - './lambda-dist:/opt/lambda-build'
    networks:
      - fs_network
    user: '0:0'

  # ================================================================
  # 6. OBSERVABILITY & EXPORTERS
  # ================================================================

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: fs_jaeger
    ports:
      - '16686:16686'
      - '4317:4317'
      - '4318:4318'
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - fs_network

  prometheus:
    image: prom/prometheus:latest
    container_name: fs_prometheus
    user: '0:0'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=10y'
      - '--storage.tsdb.retention.size=0'
      - '--web.enable-lifecycle'
      # OPTIMIZATION: Keep blocks in memory for 2 hours before writing to SSD
      - '--storage.tsdb.min-block-duration=2h'
      - '--storage.tsdb.max-block-duration=2h'
      - '--storage.tsdb.wal-compression'
    logging:
      driver: 'json-file'
      options:
        mode: 'non-blocking'
        max-buffer-size: '4m'
        max-size: '10m'
        max-file: '3'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - /Volumes/ssd/fs_project_data/prometheus:/prometheus
    ports:
      - '9090:9090'
    networks:
      - fs_network

  loki:
    image: grafana/loki:latest
    container_name: fs_loki
    user: '0:0'
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml
      - /Volumes/ssd/fs_project_data/loki:/loki
    ports:
      - '3100:3100'
    networks:
      - fs_network

  grafana:
    image: grafana/grafana:latest
    container_name: fs_grafana
    user: '0:0'
    volumes:
      - /Volumes/ssd/fs_project_data/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - '3001:3000'
    networks:
      - fs_network
    depends_on:
      - prometheus
      - loki
      - jaeger

  # ORIGINAL SIDE-CAR EXPORTER 1: POSTGRES
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: fs_postgres_exporter
    environment:
      DATA_SOURCE_NAME: 'postgresql://admin:password@fs_postgres:5432/file_system?sslmode=disable'
    ports:
      - '9187:9187'
    networks:
      - fs_network
    depends_on:
      - postgres

  # ORIGINAL SIDE-CAR EXPORTER 2: KAFKA
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: fs_kafka_exporter
    command:
      - '--kafka.server=kafka:29092'
    ports:
      - '9308:9308'
    networks:
      - fs_network
    depends_on:
      - kafka

  # ORIGINAL GENERAL EXPORTER: cAdvisor
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.1
    container_name: fs_cadvisor
    privileged: true
    # OPTIMIZATION: Slow down polling to once every 15s to stop constant SSD touching
    command:
      - '--housekeeping_interval=15s'
      - '--global_housekeeping_interval=1m'
    ports:
      - '8082:8080'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
    networks:
      - fs_network

networks:
  fs_network:
    name: fs_network
    driver: bridge

volumes:
  postgres_data:
  opensearch_data:
  kafka_data:
  minio_data: # Added named volume tracking for MinIO
